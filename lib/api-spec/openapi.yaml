openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Live South African flight and airport data
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: flights
    description: Live aircraft data for South African airspace
  - name: airports
    description: South African airport reference data
  - name: crm
    description: Authenticated itinerary, fleet and dashboard operations
  - name: privacy
    description: POPIA data-subject request operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /flights:
    get:
      operationId: getFlights
      tags: [flights]
      summary: Get current aircraft positions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current aircraft positions and source freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightsResponse"
        "503":
          description: Live data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /flights/summary:
    get:
      operationId: getFlightSummary
      tags: [flights]
      summary: Get current airspace activity totals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Flight counts and source freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightSummary"
  /airports:
    get:
      operationId: getAirports
      tags: [airports]
      summary: List South African airports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matching airports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Airport"
  /airport-routes:
    get:
      operationId: getAirportRoutes
      tags: [airports]
      summary: List reference routes serving South African airports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Known route records for South African airport codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirportRoute"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [crm]
      summary: Get combined travel operations summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current CRM counts and recent assignment activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /itineraries:
    get:
      operationId: listItineraries
      tags: [crm]
      summary: List recent itineraries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent itinerary summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItinerarySummary"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createItinerary
      tags: [crm]
      summary: Record a client flight booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryDetail"
        "400":
          description: Booking data is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /itineraries/{id}:
    get:
      operationId: getItinerary
      tags: [crm]
      summary: Get an itinerary and its fleet assignments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Itinerary details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryDetail"
        "404":
          description: Itinerary not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fleet/availability:
    get:
      operationId: getFleetAvailability
      tags: [crm]
      summary: Check fleet availability for a time range
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Vehicles and overlapping assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetAvailability"
        "400":
          description: Invalid time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fleet/assign:
    post:
      operationId: createFleetAssignment
      tags: [crm]
      summary: Assign a vehicle and driver to an itinerary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Assignment created; notification status is included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentCreated"
        "409":
          description: Vehicle is already assigned during this time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fleet/assignments/{id}/tracking-state:
    patch:
      operationId: updateFleetTrackingState
      tags: [crm]
      summary: Update the live state of a fleet assignment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingStateUpdate"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetAssignment"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /popia/dsr:
    post:
      operationId: createDsrRequest
      tags: [privacy]
      summary: Submit a data-subject request
      description: Public endpoint protected by per-IP rate limiting; sends a verification email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DsrRequestInput"
      responses:
        "202":
          description: Request received; email delivery status is included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrRequestAccepted"
        "429":
          description: Request limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listDsrRequests
      tags: [privacy]
      summary: List data-subject requests for an authenticated agent
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, processing, completed, rejected]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated data-subject requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrRequestPage"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /popia/verify/{token}:
    get:
      operationId: verifyDsrToken
      tags: [privacy]
      summary: Verify a data-subject request email token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: "^[a-fA-F0-9]{64}$"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrVerification"
        "404":
          description: Token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Verification token has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /popia/dsr/{id}:
    patch:
      operationId: updateDsrRequest
      tags: [privacy]
      summary: Update an authenticated agent's data-subject request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DsrRequestUpdate"
      responses:
        "200":
          description: Updated request and completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrRequestUpdateResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: [string, "null"]
      required: [error]
    Flight:
      type: object
      properties:
        icao24:
          type: string
        callsign:
          type: [string, "null"]
        originCountry:
          type: [string, "null"]
        longitude:
          type: [number, "null"]
        latitude:
          type: [number, "null"]
        baroAltitude:
          type: [number, "null"]
        geoAltitude:
          type: [number, "null"]
        onGround:
          type: boolean
        velocity:
          type: [number, "null"]
        trueTrack:
          type: [number, "null"]
        verticalRate:
          type: [number, "null"]
        squawk:
          type: [string, "null"]
        lastContact:
          type: [integer, "null"]
        category:
          type: [integer, "null"]
        airlineName:
          type: [string, "null"]
      required:
        - icao24
        - callsign
        - originCountry
        - longitude
        - latitude
        - baroAltitude
        - geoAltitude
        - onGround
        - velocity
        - trueTrack
        - verticalRate
        - squawk
        - lastContact
        - category
        - airlineName
    FlightsResponse:
      type: object
      properties:
        flights:
          type: array
          items:
            $ref: "#/components/schemas/Flight"
        fetchedAt:
          type: [string, "null"]
          format: date-time
        stale:
          type: boolean
        warning:
          type: [string, "null"]
      required: [flights, fetchedAt, stale, warning]
    FlightSummary:
      type: object
      properties:
        totalFlights:
          type: integer
        airborne:
          type: integer
        onGround:
          type: integer
        fetchedAt:
          type: [string, "null"]
          format: date-time
        stale:
          type: boolean
      required: [totalFlights, airborne, onGround, fetchedAt, stale]
    Airport:
      type: object
      properties:
        airportId:
          type: integer
        name:
          type: string
        city:
          type: [string, "null"]
        country:
          type: string
        iataCode:
          type: [string, "null"]
        icaoCode:
          type: [string, "null"]
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: [integer, "null"]
        timezone:
          type: [number, "null"]
        tzDatabase:
          type: [string, "null"]
        type:
          type: [string, "null"]
      required:
        - airportId
        - name
        - city
        - country
        - iataCode
        - icaoCode
        - latitude
        - longitude
        - altitude
        - timezone
        - tzDatabase
        - type
    AirportRoute:
      type: object
      properties:
        routeKey:
          type: string
        airlineCode:
          type: string
        airlineName:
          type: [string, "null"]
        sourceAirportCode:
          type: string
        destinationAirportCode:
          type: string
        stops:
          type: integer
        equipment:
          type: [string, "null"]
      required:
        - routeKey
        - airlineCode
        - airlineName
        - sourceAirportCode
        - destinationAirportCode
        - stops
        - equipment
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [scheduled, en_route, arrived, passenger_onboard, completed, cancelled]
        title:
          type: string
        detail:
          type: string
        itineraryId:
          type: [string, "null"]
          format: uuid
        itineraryReference:
          type: [string, "null"]
      required: [id, occurredAt, kind, title, detail, itineraryId, itineraryReference]
    DashboardSummary:
      type: object
      properties:
        totalItineraries:
          type: integer
        activeAssignments:
          type: integer
        availableVehicles:
          type: integer
        pendingDsrRequests:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
      required: [totalItineraries, activeAssignments, availableVehicles, pendingDsrRequests, recentActivity]
    FlightSegment:
      type: object
      properties:
        flight_number:
          type: [string, "null"]
        airline:
          type: [string, "null"]
        origin:
          type: string
        destination:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        terminal:
          type: [string, "null"]
      required: [flight_number, airline, origin, destination, departure_time, arrival_time, terminal]
    ItinerarySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        itinerary_ref:
          type: string
        client_name:
          type: string
        client_email:
          type: string
          format: email
        status:
          type: string
        departure_at:
          type: [string, "null"]
          format: date-time
        arrival_at:
          type: [string, "null"]
          format: date-time
        assignment_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required: [id, itinerary_ref, client_name, client_email, status, departure_at, arrival_at, assignment_count, created_at]
    ItineraryDetail:
      allOf:
        - $ref: "#/components/schemas/ItinerarySummary"
        - type: object
          properties:
            flight_data:
              type: object
              properties:
                segments:
                  type: array
                  items:
                    $ref: "#/components/schemas/FlightSegment"
              required: [segments]
            fleet_assignments:
              type: array
              items:
                $ref: "#/components/schemas/FleetAssignment"
          required: [flight_data, fleet_assignments]
    ItineraryInput:
      type: object
      properties:
        client_name:
          type: string
          minLength: 1
          maxLength: 160
        client_email:
          type: string
          format: email
          maxLength: 320
        client_phone:
          type: [string, "null"]
          maxLength: 64
        passport_number:
          type: [string, "null"]
          maxLength: 64
        sa_id_number:
          type: [string, "null"]
          maxLength: 32
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        flight_segments:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/FlightSegment"
      required: [client_name, client_email, flight_segments]
    FleetVehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registration:
          type: string
        make_model:
          type: string
        capacity:
          type: integer
        active:
          type: boolean
      required: [id, registration, make_model, capacity, active]
    FleetAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        itinerary_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        vehicle_registration:
          type: string
        driver_name:
          type: string
        driver_contact:
          type: [string, "null"]
        pickup_at:
          type: string
          format: date-time
        dropoff_at:
          type: string
          format: date-time
        pickup_address:
          type: string
        dropoff_address:
          type: string
        tracking_state:
          type: string
          enum: [scheduled, en_route, arrived, passenger_onboard, completed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, itinerary_id, vehicle_id, vehicle_registration, driver_name, driver_contact, pickup_at, dropoff_at, pickup_address, dropoff_address, tracking_state, created_at, updated_at]
    FleetAvailability:
      type: object
      properties:
        vehicle:
          $ref: "#/components/schemas/FleetVehicle"
        available:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/FleetAssignment"
      required: [vehicle, available, conflicts]
    AssignmentInput:
      type: object
      properties:
        itinerary_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        driver_name:
          type: string
          minLength: 1
          maxLength: 160
        driver_contact:
          type: string
          minLength: 1
          maxLength: 64
        pickup_at:
          type: string
          format: date-time
        dropoff_at:
          type: string
          format: date-time
        pickup_address:
          type: string
          minLength: 1
          maxLength: 500
        dropoff_address:
          type: string
          minLength: 1
          maxLength: 500
        client_email:
          type: string
          format: email
          maxLength: 320
        notes:
          type: [string, "null"]
          maxLength: 2000
      required: [itinerary_id, vehicle_id, driver_name, driver_contact, pickup_at, dropoff_at, pickup_address, dropoff_address, client_email]
    AssignmentCreated:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/FleetAssignment"
        notification_sent:
          type: boolean
        notification_message:
          type: [string, "null"]
      required: [assignment, notification_sent, notification_message]
    TrackingStateUpdate:
      type: object
      properties:
        tracking_state:
          type: string
          enum: [scheduled, en_route, arrived, passenger_onboard, completed, cancelled]
      required: [tracking_state]
    DsrRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject_email:
          type: string
          format: email
        subject_name:
          type: [string, "null"]
        request_type:
          type: string
          enum: [access, erasure, correction, objection]
        status:
          type: string
          enum: [pending, verified, processing, completed, rejected]
        created_at:
          type: string
          format: date-time
        verified_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        notes:
          type: [string, "null"]
      required: [id, subject_email, subject_name, request_type, status, created_at, verified_at, completed_at, notes]
    DsrRequestPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DsrRequest"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required: [items, page, limit, total]
    DsrRequestInput:
      type: object
      properties:
        subject_email:
          type: string
          format: email
          maxLength: 320
        subject_name:
          type: [string, "null"]
          maxLength: 160
        request_type:
          type: string
          enum: [access, erasure, correction, objection]
      required: [subject_email, request_type]
    DsrRequestAccepted:
      type: object
      properties:
        ref:
          type: string
          format: uuid
        verification_email_sent:
          type: boolean
        message:
          type: string
      required: [ref, verification_email_sent, message]
    DsrVerification:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        verified:
          type: boolean
        message:
          type: string
      required: [request_id, verified, message]
    DsrRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [verified, processing, completed, rejected]
        notes:
          type: [string, "null"]
          maxLength: 2000
      required: [status]
    DsrRequestUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        request:
          $ref: "#/components/schemas/DsrRequest"
      required: [success, request]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

